<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>DiseaseChecker</title>

    <link rel="stylesheet" href="../css/symptom.css" />

    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;

        background: linear-gradient(135deg, #5b4df0, #7c3aed);

        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .container {
        width: 80%;
        max-width: 900px;

        background: white;

        border-radius: 30px;

        padding: 40px;

        box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.2);
      }

      .header {
        text-align: center;

        margin-bottom: 30px;
      }

      .header h1 {
        font-size: 50px;

        margin-bottom: 10px;

        color: #333;
      }

      .header p {
        color: gray;

        font-size: 20px;
      }

      .input-section {
        margin-top: 20px;
      }

      .input-row {
        display: flex;

        gap: 10px;
      }

      input {
        flex: 1;

        padding: 15px;

        border-radius: 12px;

        border: 1px solid #ccc;

        font-size: 18px;
      }

      button {
        padding: 15px;

        border: none;

        border-radius: 12px;

        cursor: pointer;

        font-size: 18px;
      }

      .add-btn {
        background: #5b4df0;

        color: white;

        width: 220px;
      }

      .check-btn {
        margin-top: 30px;

        width: 100%;

        background: linear-gradient(90deg, #5b4df0, #7c3aed);

        color: white;
      }

      #symptomList {
        margin-top: 25px;

        min-height: 70px;

        border: 2px dashed #ddd;

        padding: 15px;

        border-radius: 15px;
      }

      .chip {
        display: inline-block;

        padding: 10px 15px;

        background: #5b4df0;

        color: white;

        border-radius: 20px;

        margin: 5px;
      }

      .chip button {
        background: none;

        border: none;

        color: white;

        margin-left: 8px;

        cursor: pointer;
      }

      .result-card {
        margin-top: 30px;

        padding: 20px;

        border-radius: 15px;

        background: #f4f6ff;
      }

      .result-card h2 {
        color: #5b4df0;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="header">
        <h1>🏥 DiseaseChecker</h1>

        <p>AI-Powered Medical Symptom Checker</p>
      </div>

      <div class="input-section">
        <div class="input-row">
          <input
            id="symptomInput"
            list="symptomSuggestions"
            placeholder="Select symptom"
          />

          <datalist id="symptomSuggestions"> </datalist>

          <button class="add-btn" onclick="addSymptom()">+ Add Symptom</button>
        </div>

        <div id="symptomList">No symptoms selected</div>

        <button class="check-btn" onclick="checkDisease()">
          🔍 Check Disease
        </button>

        <div id="result"></div>
      </div>
    </div>

    <script src="../js/symptom.js"></script>
  </body>
</html>
